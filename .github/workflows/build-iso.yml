name: Build and Release Raptor OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-iso:
    name: Build Raptor OS Home Edition ISO
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/pipx
          docker system prune -af --volumes
          echo "Disk space after cleanup:"
          df -h

      - name: Build installer ISO
        id: build
        uses: jasonn3/build-container-installer@v1.4.0
        with:
          arch: x86_64
          image_name: raptor-os
          image_repo: ghcr.io/cerberus9-dev
          image_tag: latest
          image_signed: "true"
          version: "44"
          variant: kinoite
          iso_name: build/raptor-os-home-${{ github.run_number }}.iso

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: raptor-os-home-iso-${{ github.run_number }}
          path: |
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}
            ${{ steps.build.outputs.iso_path }}/${{ steps.build.outputs.iso_name }}-CHECKSUM
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
