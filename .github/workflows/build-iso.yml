name: Build Raptor Home Edition ISO

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Build Release Type'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - stable

jobs:
  build-home-iso:
    name: Build Raptor Home ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h

      # ── Build OSTree image first ─────────────────────────────────────────────
      - name: Build OSTree image
        uses: blue-build/github-action@v1
        id: build
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}

      # ── Generate ISO from OSTree commit ──────────────────────────────────────
      - name: Generate ISO from OSTree
        run: |
          # Extract the OSTree commit from the built image
          IMAGE_REF="${{ steps.build.outputs.image-ref }}"
          echo "Built image: $IMAGE_REF"
          
          # Use coreos-installer to create ISO from the OSTree image
          # This creates a bootable ISO that installs the OSTree image
          sudo dnf install -y coreos-installer
          
          # The blue-build action outputs the image reference
          # We need to extract the ostree commit and create an ISO
          coreos-installer iso customize \
            --image-url "$IMAGE_REF" \
            --output raptor-home-${{ github.run_id }}-amd64.iso \
            --dest-console tty0 \
            --dest-device /dev/sda \
            --config /dev/stdin << 'IGNITION'
{
  "ignition": { "version": "3.2.0" },
  "storage": {
    "files": [
      {
        "path": "/etc/hostname",
        "overwrite": true,
        "contents": { "source": "data:,raptor-os" }
      }
    ]
  }
}
IGNITION

      - name: Verify ISO
        run: |
          ls -la *.iso
          sha256sum *.iso > raptor-home.iso.sha256
          cat raptor-home.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raptor-home-iso-${{ github.run_id }}
          path: |
            *.iso
            *.iso.sha256
          retention-days: 14
