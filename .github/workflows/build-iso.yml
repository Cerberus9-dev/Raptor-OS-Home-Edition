name: Build ISO

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Build Release Type'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - stable

jobs:
  build-home-iso:
    name: Build Raptor Home ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h

      # ── Build OSTree image via blue-build ────────────────────────────────────
      - name: Build OSTree image
        id: build
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}

      # ── Create ISO from OSTree image ────────────────────────────────────────
      - name: Install ISO tooling
        run: |
          sudo dnf install -y coreos-installer xorriso

      - name: Generate ISO from OSTree image
        id: iso
        run: |
          IMAGE_REF="${{ steps.build.outputs.image-ref }}"
          echo "Building ISO from: $IMAGE_REF"
          
          # Create a minimal Ignition config for the installer
          cat > /tmp/installer.ign << 'IGNITION'
{
  "ignition": { "version": "3.2.0" },
  "storage": {
    "files": [
      {
        "path": "/etc/hostname",
        "overwrite": true,
        "contents": { "source": "data:,raptor-os" }
      }
    ]
  }
}
IGNITION

          # Generate ISO using coreos-installer
          # This creates a bootable ISO that installs the OSTree image
          coreos-installer iso customize \
            --image-url "$IMAGE_REF" \
            --output raptor-home-${{ github.run_id }}-amd64.iso \
            --dest-console tty0 \
            --dest-device /dev/sda \
            --config /tmp/installer.ign \
            2>&1 | tee iso-build.log

      - name: Verify ISO
        run: |
          ls -la *.iso
          sha256sum *.iso > raptor-home.iso.sha256
          cat raptor-home.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raptor-home-iso-${{ github.run_id }}
          path: |
            *.iso
            *.iso.sha256
          retention-days: 14

      - name: Upload Failure Logs on Error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-home-build-failure-log
          path: |
            iso-build.log
            build.log
          retention-days: 7
