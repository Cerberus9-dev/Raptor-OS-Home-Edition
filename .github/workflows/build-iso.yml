name: Build Raptor OS ISO

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build-iso:
    name: Build Raptor OS Home Edition ISO
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/pipx
          docker system prune -af --volumes
          mkdir -p output
          echo "Disk space after cleanup:"
          df -h

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Verify and pin the published Raptor image
        id: image
        env:
          IMAGE_REF: ghcr.io/cerberus9-dev/raptor-os:latest
        run: |
          set -euo pipefail
          cosign verify --key cosign.pub "$IMAGE_REF" > verified-signatures.json
          DIGEST="$(jq -r '.[0].critical.image.docker-manifest-digest' verified-signatures.json)"
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Cosign verification did not return a valid image digest."
            cat verified-signatures.json
            exit 1
          fi
          echo "Verified image: $IMAGE_REF@$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Download and verify the Fedora 44 Kinoite installer
        env:
          ISO_NAME: Fedora-Kinoite-ostree-x86_64-44-1.7.iso
          CHECKSUM_NAME: Fedora-Kinoite-44-1.7-x86_64-CHECKSUM
          EXPECTED_SHA256: 4a944312b4e861ab625fd9786957174ef122a8a406bbb54caba7665e0d9f0e92
        run: |
          set -euo pipefail
          BASE_URL="https://download.fedoraproject.org/pub/fedora/linux/releases/44/Kinoite/x86_64/iso"
          curl -fL --retry 5 --retry-delay 5 "$BASE_URL/$ISO_NAME" -o "$ISO_NAME"
          curl -fL --retry 5 --retry-delay 5 "$BASE_URL/$CHECKSUM_NAME" -o "$CHECKSUM_NAME"
          curl -fL --retry 5 --retry-delay 5 https://fedoraproject.org/fedora.gpg -o fedora.gpg
          gpgv --keyring fedora.gpg --output - "$CHECKSUM_NAME" | sha256sum -c --ignore-missing
          echo "$EXPECTED_SHA256  $ISO_NAME" | sha256sum -c -

      - name: Create interactive Raptor OS Kickstart
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cat > raptor-ks.cfg <<EOF
          # Raptor OS Home Edition — interactive installation.
          # No clearpart, autopart, or disk-selection directives are supplied:
          # Anaconda leaves target disk selection and partitioning to the user.
          graphical
          lang en_US.UTF-8
          keyboard us
          ostreecontainer --url=ghcr.io/cerberus9-dev/raptor-os@${IMAGE_DIGEST} --transport=registry
          EOF
          cat raptor-ks.cfg

      - name: Remaster Fedora Kinoite ISO with mkksiso
        env:
          ISO_NAME: Fedora-Kinoite-ostree-x86_64-44-1.7.iso
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -e ISO_NAME="$ISO_NAME" \
            -v "$PWD:/work" \
            -w /work \
            quay.io/fedora/fedora:44 \
            bash -lc '
              set -euo pipefail
              dnf install -y lorax xorriso isomd5sum
              ksvalidator -v F44 raptor-ks.cfg
              mkksiso --ks raptor-ks.cfg "$ISO_NAME" output/raptor-os-home-edition.iso
              xorriso -indev output/raptor-os-home-edition.iso -toc
            '

      - name: Verify ISO output and create checksum
        run: |
          set -euo pipefail
          ISO=output/raptor-os-home-edition.iso
          test -s "$ISO"
          SIZE="$(stat -c '%s' "$ISO")"
          if [ "$SIZE" -lt 1073741824 ]; then
            echo "::error::ISO is unexpectedly small (${SIZE} bytes)."
            exit 1
          fi
          sha256sum "$ISO" | tee "$ISO.sha256"
          printf '%s\n' "${{ steps.image.outputs.digest }}" > output/raptor-os-image-digest.txt
          ls -lh "$ISO" "$ISO.sha256" output/raptor-os-image-digest.txt

      - name: Upload ISO, checksum and image digest
        uses: actions/upload-artifact@v4
        with:
          name: raptor-os-home-iso-${{ github.run_number }}
          path: |
            output/raptor-os-home-edition.iso
            output/raptor-os-home-edition.iso.sha256
            output/raptor-os-image-digest.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
