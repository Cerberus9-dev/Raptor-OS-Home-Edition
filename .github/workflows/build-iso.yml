name: Build and Release Raptor OS ISO

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Runner Disk Space
        run: |
          echo "=== Free disk space before cleanup ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/pipx
          docker system prune -af --volumes
          echo "=== Free disk space after cleanup ==="
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y osbuild lorax squashfs-tools genisoimage

      - name: Run ISO Build
        run: |
          # If using a direct osbuild command:
          osbuild --store ./build/store --output-directory ./output raptor-manifest.json || \
          cargo build --release

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raptor-os-home-iso
          path: |
            output/*.iso
            build/*.iso
          retention-days: 7
