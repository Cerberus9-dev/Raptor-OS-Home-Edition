- name: Build original Shroudly desktop app
        working-directory: files/scripts/shroudly-raptor/upstream
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -euo pipefail
          npm ci
          npm run build:core
          npm run check:translations
          npm run build
          npm run test:net
          npx electron-builder --linux dir --x64 --publish never

          APP_DIR="$PWD/dist/linux-unpacked"
          APP_BIN="$(find "$APP_DIR" -maxdepth 1 -type f -executable -printf '%f\n' | grep -i -x 'shroudly' | head -n1 || true)"
          if [[ -z "$APP_BIN" ]]; then
            echo "::error::Could not find the original Shroudly Electron executable in dist/linux-unpacked."
            find "$APP_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          STAGE="$GITHUB_WORKSPACE/files/staging"
          rm -rf "$STAGE/raptor-shroudly-app" "$STAGE/raptor-shroudly-app.tar.gz"
          install -d "$STAGE"

          # Single tarball is far more reliable for BlueBuild's files module
          # than a directory tree containing a large app.asar.
          tar -C "$APP_DIR" -czf "$STAGE/raptor-shroudly-app.tar.gz" .
          # Keep a thin directory copy only for local debugging; the install
          # script prefers the tarball.
          install -d "$STAGE/raptor-shroudly-app"
          cp -a "$APP_DIR/." "$STAGE/raptor-shroudly-app/"

          printf '#!/usr/bin/env bash\nset -euo pipefail\nexec /opt/raptor-shroudly/%s "$@"\n' "$APP_BIN" > "$STAGE/raptor-shroudly"
          chmod 0755 "$STAGE/raptor-shroudly"

          install -Dm0644 public/icon.png "$STAGE/raptor-shroudly-icon.png"
          install -Dm0644 LICENSE "$STAGE/raptor-shroudly-license"
          install -Dm0644 scripts/linux/me.codeshare.shroudly.policy "$STAGE/raptor-shroudly-policy"

          # Explicit credit / NOTICE for Raptor packaging
          cat > "$STAGE/raptor-shroudly-notice" <<'NOTICE'
          Raptor Shroudly
          ---------------
          This package is the Raptor OS edition of Shroudly.

          Functional core (engine, UI, techniques):
            Shroudly — https://github.com/umutxyp/Shroudly
            Copyright (c) Codeshare Technology Ltd
            Licensed under the MIT License (see LICENSE in this package).

          Raptor OS packaging, branding, desktop integration and future
          native routing / game-mode work:
            Cerberus9-dev / Raptor OS
            https://github.com/Cerberus9-dev/Raptor-OS-Home-Edition

          The original Shroudly project is preserved and credited. Raptor
          does not claim authorship of the upstream engine or techniques.
          NOTICE

          # Strict pre-flight checks
          test -x "$STAGE/raptor-shroudly"
          test -s "$STAGE/raptor-shroudly-app.tar.gz"
          test -s "$STAGE/raptor-shroudly-app/resources/app.asar"
          test -s "$STAGE/raptor-shroudly-icon.png"
          test -s "$STAGE/raptor-shroudly-license"
          test -s "$STAGE/raptor-shroudly-policy"
          test -s "$STAGE/raptor-shroudly-notice"

          ASAR_SIZE=$(stat -c%s "$STAGE/raptor-shroudly-app/resources/app.asar")
          TAR_SIZE=$(stat -c%s "$STAGE/raptor-shroudly-app.tar.gz")
          echo "Staged Shroudly payload: asar=\( {ASAR_SIZE} bytes, tar= \){TAR_SIZE} bytes, launcher=$APP_BIN"