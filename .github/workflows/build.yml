name: Build Raptor OS

on:
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - "changelog.md"

  pull_request:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"

  schedule:
    - cron: "0 4 * * 0"

  workflow_dispatch:

jobs:
  # Push webhook deliveries can arrive out of order. Check the live branch head
  # before entering the build concurrency group, so a delayed older event cannot
  # cancel a build for a newer commit.
  check-latest-push:
    name: Check whether this push is still current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.latest.outputs.should_build }}
    steps:
      - name: Compare event SHA with current branch head
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! latest_sha="$(gh api "repos/$REPOSITORY/commits/$REF_NAME" --jq .sha)"; then
            echo "::warning::Could not verify the live branch head; allowing this build rather than dropping a push."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$latest_sha" == "$PUSH_SHA" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping superseded push $PUSH_SHA; current branch head is $latest_sha."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-latest-push
    if: ${{ needs.check-latest-push.outputs.should_build == 'true' }}
    name: Build & Push Image
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull-request validation must test the proposed head, not silently
          # fall back to the base branch. Push and dispatch events use github.sha.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false

      # Fail fast on repository syntax/contracts before expensive upstream app builds.
      - name: Lint all GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Validate scripts
        run: |
          chmod +x .github/scripts/validate.sh
          .github/scripts/validate.sh


      - name: Check signing secret
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "$SIGNING_SECRET" ]; then
            echo "::error title=Missing secret::SIGNING_SECRET is not set (Settings > Secrets and variables > Actions). The image cannot be signed, so users' updates will be rejected."
            exit 1
          fi

      - name: Free disk space
        run: |
          set -euo pipefail
          # Keep this cleanup bounded: recursively deleting the full hosted
          # toolcache can stall before compilation even begins. Remove only
          # large optional SDK directories, and cap the cleanup time.
          timeout 90s sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || {
            echo "::warning::Optional SDK cleanup timed out; continuing with the runner's remaining free space."
          }
          df -h

      - name: Cache Raptor Music workspace
        uses: actions/cache@v4
        with:
          path: files/scripts/raptor-music/target
          key: raptor-music-target-${{ runner.os }}-${{ hashFiles('files/scripts/raptor-music/Cargo.toml', 'files/scripts/raptor-music/crates/**/Cargo.toml') }}
          restore-keys: raptor-music-target-${{ runner.os }}-

      - name: Build Raptor Music
        run: |
          set -euo pipefail

          # Hosted-runner package mirrors can briefly fail DNS resolution. Use
          # APT's per-download retries and retry the install as a whole so a
          # transient mirror outage does not prevent the Rust build from running.
          sudo apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 update

          install_attempt=1
          until sudo apt-get -o Acquire::Retries=5 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            install -y --no-install-recommends \
              pkg-config \
              libasound2-dev \
              libfontconfig1-dev \
              libfreetype6-dev \
              libxkbcommon-dev \
              libxkbcommon-x11-dev \
              libwayland-dev \
              libxcb1-dev \
              libxcb-shape0-dev \
              libxcb-xfixes0-dev \
              libgl1-mesa-dev \
              libegl1-mesa-dev \
              libgles2-mesa-dev \
              libgtk-3-dev \
              libudev-dev \
              libdbus-1-dev; do
            if [[ "$install_attempt" -ge 3 ]]; then
              echo "::error::Unable to install Raptor Music build dependencies after 3 attempts."
              exit 1
            fi
            echo "::warning::APT dependency installation failed; retrying after a short delay (attempt $((install_attempt + 1))/3)."
            sleep $((install_attempt * 20))
            install_attempt=$((install_attempt + 1))
          done

          cargo build --release --workspace --manifest-path files/scripts/raptor-music/Cargo.toml
          install -Dm755 files/scripts/raptor-music/target/release/raptor-desktop files/staging/raptor-music

      - name: Test Raptor Music workspace
        run: cargo test --workspace --manifest-path files/scripts/raptor-music/Cargo.toml

      - name: Build and test custom Raptor Shroudly
        run: |
          cargo build --release --workspace --manifest-path files/scripts/shroudly-raptor/Cargo.toml
          cargo test --workspace --manifest-path files/scripts/shroudly-raptor/Cargo.toml
          install -Dm755 files/scripts/shroudly-raptor/target/release/shroudly-raptor files/staging/raptor-shroudly
          test -x files/staging/raptor-shroudly

      - name: Verify and include Raptor app payloads in the image context
        run: |
          set -euo pipefail
          test -x files/staging/raptor-music
          test -x files/staging/raptor-shroudly

          # Force-add generated, gitignored staging files so Git-backed
          # build contexts retain both custom Raptor application binaries.
          git add -f -- files/staging
          git ls-files --error-unmatch \
            files/staging/raptor-music \
            files/staging/raptor-shroudly >/dev/null
          echo "Verified both custom Raptor app binaries and added them to the BlueBuild context."

          # BlueBuild's Git-backed files context is created from HEAD, not the
          # runner's uncommitted index. Commit generated payloads locally so
          # the files module receives both app trees. Payload presence is
          # the install gate; no separate marker file is required. This
          # commit exists only on the ephemeral Actions runner; it is never
          # pushed and does not alter the repository branch.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --no-verify -m "ci: include Raptor app payloads in image context"

      - name: Build and push image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          # Keep the current runner checkout: it contains the generated app payload commit.
          skip_checkout: true

      - name: Verify both apps inside the published image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE_VERSION="$(sed -nE 's/^image-version:[[:space:]]*([^[:space:]#]+).*/\1/p' recipes/recipe.yml | head -n1)"
          if [[ -z "$IMAGE_VERSION" ]]; then
            echo "::error::Could not read image-version from recipes/recipe.yml"
            exit 1
          fi
          # BlueBuild tags the output with the Fedora release suffix, not the
          # full base tag (stable-44 -> -44).
          IMAGE_VERSION_SUFFIX="${IMAGE_VERSION##*-}"
          if [[ ! "$IMAGE_VERSION_SUFFIX" =~ ^[0-9]+$ ]]; then
            echo "::error::Unexpected BlueBuild image-version suffix: $IMAGE_VERSION"
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # BlueBuild uses a PR-number tag for pull-request builds.
            IMAGE_TAG="pr-$PR_NUMBER-$IMAGE_VERSION_SUFFIX"
          else
            # BlueBuild publishes the short commit-SHA tag for push,
            # workflow_dispatch, and schedule builds. It does not publish
            # a branch-name tag such as main-44.
            IMAGE_TAG="${GITHUB_SHA:0:7}-$IMAGE_VERSION_SUFFIX"
          fi
          echo "Verifying BlueBuild image tag: $IMAGE_TAG"
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/raptor-os:$IMAGE_TAG"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          # GHCR image layers are served through a CDN; transient connection
          # resets can interrupt a large pull after the image was published
          # successfully. Retry the verification pull without rebuilding.
          pull_attempt=1
          until docker pull "$IMAGE_REF"; do
            if [[ "$pull_attempt" -ge 4 ]]; then
              echo "::error::Unable to pull the published image for verification after 4 attempts."
              exit 1
            fi
            delay=$((pull_attempt * 15))
            echo "::warning::Image verification pull failed; retrying in ${delay}s (attempt $((pull_attempt + 1))/4)."
            sleep "$delay"
            pull_attempt=$((pull_attempt + 1))
          done
          docker run --rm --entrypoint /bin/bash "$IMAGE_REF" -lc '
            set -euo pipefail
            check_file() {
              local mode="$1" path="$2"
              if [[ "$mode" == "x" ]]; then
                [[ -x "$path" ]] || { echo "MISSING_EXECUTABLE: $path" >&2; exit 1; }
              else
                [[ -s "$path" ]] || { echo "MISSING_FILE: $path" >&2; exit 1; }
              fi
              echo "VERIFIED: $path"
            }
            check_file x /usr/bin/raptor-music
            check_file s /usr/share/applications/raptor-music.desktop
            check_file s /usr/share/icons/hicolor/scalable/apps/raptor-music.svg
            check_file x /usr/bin/raptor-shroudly
            check_file s /usr/share/applications/raptor-shroudly.desktop
            check_file s /usr/share/icons/hicolor/scalable/apps/raptor-shroudly.svg
          '
          echo "Published image contains both custom Raptor app payloads."

          echo "=== OCI image size (uncompressed virtual size) ==="
          docker image inspect --format='{{.Size}}' "$IMAGE_REF" | awk '{printf "Virtual image size: %.2f GiB\n", $1 / 1073741824}'
          echo "=== Largest image layers ==="
          docker history --no-trunc --format='{{.Size}} {{.CreatedBy}}' "$IMAGE_REF" | sed -n '1,12p'
          echo "=== Installed filesystem usage ==="
          docker run --rm --entrypoint /bin/bash "$IMAGE_REF" -lc \
            'du -x -B1 -s /usr /opt /var 2>/dev/null | sort -nr | sed -n "1,12p" || true'

  # Runs only when the build fails. GitHub's raw job logs are awkward to get at,
  # so this reads the failed job's log on the runner and posts the first real
  # error, with context, as an annotation. It shows on the run page and is
  # available through the API without downloading any logs.
  diagnose:
    name: Explain build failure
    needs: build
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Post the build error as an annotation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          for id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
            ok=0
            for _ in 1 2 3 4 5 6; do
              if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" -o job.log 2> err.txt && [ -s job.log ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" = 0 ]; then
              echo "::warning::could not fetch the log for job $id: $(head -c 300 err.txt | tr '\n' ' ')"
              continue
            fi
            # Strip timestamps, colours and BlueBuild's repeated "[hh:mm:ss name] =>" prefix, and
            # shorten lines: GitHub caps one annotation at 4096 characters.
            sed -E 's/^[0-9T:.Z-]+ //; s/\x1b\[[0-9;]*m//g; s/^ *\[[0-9:]+ [^]]*\] => //' job.log | cut -c1-170 > clean.log
            emit() {  # emit "title" file -> one annotation (newlines/percent encoded, last 3800 chars kept)
              local msg
              msg=$(tail -c 3800 "$2" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=$1 (job $id)::$msg"
            }
            # 1) every line that looks like a failure (last 25), so the cause is visible at a glance
            grep -n -i -E "Failed '|error:|ERROR\]|No match|not found|unable to|cannot |conflict|exit code|denied|no such file|syntax error" clean.log \
              | grep -v -E "log_error|alias |echo |notice|ubuntu-latest" | tail -n 25 | cut -c1-170 > fails.txt
            [ -s fails.txt ] && emit "Failure lines" fails.txt
            # 2) the context around the first module failure (or the last failure line)
            n=$(grep -n -m1 -E "Failed '[^']*' Module" clean.log | cut -d: -f1)
            [ -z "$n" ] && n=$(tail -n 1 fails.txt | cut -d: -f1)
            if [ -n "$n" ]; then
              start=$((n>28 ? n-28 : 1)); end=$((n+6))
              sed -n "${start},${end}p" clean.log > ctx.txt
              emit "Context before the failure" ctx.txt
            fi
          done
