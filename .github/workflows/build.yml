name: Build Raptor OS

on:
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"

  schedule:
    - cron: "0 4 * * 0"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede older runs for the same PR/branch push; never cancel a
  # scheduled or manually dispatched build because someone pushed meanwhile.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Check signing secret
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "$SIGNING_SECRET" ]; then
            echo "::error title=Missing secret::SIGNING_SECRET is not set (Settings > Secrets and variables > Actions). The image cannot be signed, so users' updates will be rejected."
            exit 1
          fi

      - name: Validate scripts
        run: |
          chmod +x .github/scripts/validate.sh
          .github/scripts/validate.sh

      - name: Build and push image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}

  # Runs only when the build fails. GitHub's raw job logs are awkward to get at,
  # so this reads the failed job's log on the runner and posts the first real
  # error, with context, as an annotation. It shows on the run page and is
  # available through the API without downloading any logs.
  diagnose:
    name: Explain build failure
    needs: build
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Post the build error as an annotation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          for id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
            ok=0
            for try in 1 2 3 4 5 6; do
              if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" -o job.log 2> err.txt && [ -s job.log ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" = 0 ]; then
              echo "::warning::could not fetch the log for job $id: $(head -c 300 err.txt | tr '\n' ' ')"
              continue
            fi
            sed -E 's/^[0-9T:.Z-]+ //; s/\x1b\[[0-9;]*m//g' job.log > clean.log
            emit() {  # emit "title" file  -> one annotation, newlines/percent encoded
              local msg
              msg=$(cut -c1-400 "$2" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=$1 (job $id)::$msg"
            }
            # The first "Failed '<name>' Module" is the real failure; otherwise the LAST
            # error-looking line (not the first: installer scripts print "ERROR:" in their own source).
            n=$(grep -n -m1 -E "Failed '[^']*' Module" clean.log | cut -d: -f1)
            if [ -z "$n" ]; then
              n=$(grep -n -E "(error|Error|ERROR)(:|\])" clean.log | grep -v -E "log_error|alias |echo " | tail -1 | cut -d: -f1)
            fi
            if [ -n "$n" ]; then
              start=$((n>45 ? n-45 : 1)); end=$((n+8))
              sed -n "${start},${end}p" clean.log > ctx.txt
              emit "Build error" ctx.txt
            fi
            tail -n 40 clean.log > tail.txt
            emit "Log tail" tail.txt
          done
