name: Build Raptor OS

on:
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - "changelog.md"

  pull_request:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"

  schedule:
    - cron: "0 4 * * 0"

  workflow_dispatch:
    inputs:
      include_one_time_apps:
        description: 'Maintainer recovery fallback; include the one-time app payload in this image build'
        required: false
        type: boolean
        default: false

jobs:
  # Push webhook deliveries can arrive out of order. Check the live branch head
  # before entering the build concurrency group, so a delayed older event cannot
  # cancel a build for a newer commit.
  check-latest-push:
    name: Check whether this push is still current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.latest.outputs.should_build }}
    steps:
      - name: Compare event SHA with current branch head
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! latest_sha="$(gh api "repos/$REPOSITORY/commits/$REF_NAME" --jq .sha)"; then
            echo "::warning::Could not verify the live branch head; allowing this build rather than dropping a push."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$latest_sha" == "$PUSH_SHA" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping superseded push $PUSH_SHA; current branch head is $latest_sha."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-latest-push
    if: ${{ needs.check-latest-push.outputs.should_build == 'true' }}
    name: Build & Push Image
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check one-time app integration lock
        id: one_time_apps
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INCLUDE_ONE_TIME_APPS: ${{ inputs.include_one_time_apps }}
        run: |
          set -euo pipefail

          # An explicit maintainer recovery dispatch must take precedence over
          # the consumed tag so a missing payload can be repaired in a new image.
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INCLUDE_ONE_TIME_APPS" == "true" ]]; then
            echo "include=true" >> "$GITHUB_OUTPUT"
            echo "One-time app payload explicitly enabled for recovery."
            exit 0
          fi

          if git ls-remote --exit-code origin refs/tags/raptor-one-time-apps-consumed >/dev/null 2>&1; then
            echo "include=false" >> "$GITHUB_OUTPUT"
            echo "The one-time app payload is already marked consumed."
            exit 0
          fi

          # This repository marker opts the first successful main-branch image
          # build into the one-time payload. End users never run Actions.
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" == "main" && -f ".github/one-time-apps-v3.0.0" ]]; then
            echo "include=true" >> "$GITHUB_OUTPUT"
            echo "Including the one-time app payload in this update image."
            exit 0
          fi

          echo "include=false" >> "$GITHUB_OUTPUT"
          echo "One-time applications are disabled for this run."

      - name: Fetch pinned upstream Shroudly source
        if: ${{ steps.one_time_apps.outputs.include == 'true' || github.event_name == 'pull_request' }}
        run: git submodule update --init --depth 1 files/scripts/shroudly-raptor/upstream

      - name: Set up Node.js for upstream Shroudly
        if: ${{ steps.one_time_apps.outputs.include == 'true' || github.event_name == 'pull_request' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: files/scripts/shroudly-raptor/upstream/package-lock.json

      - name: Install and verify upstream Shroudly
        if: ${{ steps.one_time_apps.outputs.include == 'true' || github.event_name == 'pull_request' }}
        working-directory: files/scripts/shroudly-raptor/upstream
        run: |
          npm ci
          npm run test:core
          npm run verify
          npm run build:core:advanced
          npx electron-builder --linux dir --publish never
          test -x dist/linux-unpacked/shroudly
          test -x dist/linux-unpacked/resources/app.asar.unpacked/electron/tools/core/linux-x64/shroudly-core
          test -x dist/linux-unpacked/resources/app.asar.unpacked/electron/tools/core/linux-x64/shroudly-core-adv

      - name: Stage original Shroudly desktop app
        if: ${{ steps.one_time_apps.outputs.include == 'true' }}
        working-directory: files/scripts/shroudly-raptor/upstream
        run: |
          install -d ../../../staging/shroudly-app
          cp -a dist/linux-unpacked/. ../../../staging/shroudly-app/
          install -Dm644 LICENSE ../../../staging/shroudly-app/LICENSE
          install -Dm644 scripts/linux/me.codeshare.shroudly.policy ../../../staging/shroudly-app/me.codeshare.shroudly.policy
          install -Dm644 public/icon.png ../../../staging/shroudly-app/shroudly.png

      - name: Check signing secret
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "$SIGNING_SECRET" ]; then
            echo "::error title=Missing secret::SIGNING_SECRET is not set (Settings > Secrets and variables > Actions). The image cannot be signed, so users' updates will be rejected."
            exit 1
          fi

      - name: Lint all GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Validate scripts
        run: |
          chmod +x .github/scripts/validate.sh
          .github/scripts/validate.sh

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Cache Raptor Music workspace
        if: ${{ steps.one_time_apps.outputs.include == 'true' || github.event_name == 'pull_request' }}
        uses: actions/cache@v4
        with:
          path: files/scripts/raptor-music/target
          key: raptor-music-target-${{ runner.os }}-${{ hashFiles('files/scripts/raptor-music/Cargo.toml', 'files/scripts/raptor-music/crates/**/Cargo.toml') }}
          restore-keys: raptor-music-target-${{ runner.os }}-

      - name: Build Raptor Music
        if: ${{ steps.one_time_apps.outputs.include == 'true' || github.event_name == 'pull_request' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libasound2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libxcb1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libgtk-3-dev \
            libudev-dev \
            libdbus-1-dev
          cargo build --release --workspace --manifest-path files/scripts/raptor-music/Cargo.toml
          if [[ "${{ steps.one_time_apps.outputs.include }}" == "true" ]]; then
            install -Dm755 files/scripts/raptor-music/target/release/raptor-desktop files/staging/raptor-music
          else
            echo "PR validation only: built Raptor Music without staging it into the image."
          fi

      - name: Test Raptor Music workspace
        if: ${{ steps.one_time_apps.outputs.include == 'true' || github.event_name == 'pull_request' }}
        run: cargo test --workspace --manifest-path files/scripts/raptor-music/Cargo.toml

      - name: Verify and include one-time app payload in the image context
        if: ${{ steps.one_time_apps.outputs.include == 'true' }}
        run: |
          set -euo pipefail
          test -x files/staging/raptor-music
          test -x files/staging/shroudly-app/shroudly
          test -s files/staging/shroudly-app/resources/app.asar
          test -x files/staging/shroudly-app/resources/app.asar.unpacked/electron/tools/core/linux-x64/shroudly-core
          test -x files/staging/shroudly-app/resources/app.asar.unpacked/electron/tools/core/linux-x64/shroudly-core-adv
          test -s files/staging/shroudly-app/me.codeshare.shroudly.policy
          test -s files/staging/shroudly-app/shroudly.png
          test -s files/staging/shroudly-app/LICENSE

          # Use a normal filename (not a dotfile) and force-add generated,
          # gitignored staging files so Git-backed build contexts retain them.
          install -Dm644 /dev/null files/staging/include-one-time-apps
          git add -f -- files/staging
          git ls-files --error-unmatch \
            files/staging/include-one-time-apps \
            files/staging/raptor-music \
            files/staging/shroudly-app/shroudly \
            files/staging/shroudly-app/resources/app.asar >/dev/null
          echo "Verified both app payloads and added them to the BlueBuild context."

      - name: Build and push image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}

      # Consume the one-time switch ONLY after BlueBuild has successfully built
      # and pushed the image. A failed image build must not burn the one-time run.
      - name: Permanently consume the one-time integration
        if: ${{ steps.one_time_apps.outputs.include == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_COMMIT: ${{ github.sha }}
          RECOVERY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.include_one_time_apps }}
        run: |
          set -euo pipefail

          # Use the authenticated GitHub API rather than relying on checkout's
          # persisted Git credentials, which image-build tooling may alter.
          # The tag is the durable one-time gate and must point at the commit
          # whose image was successfully built and pushed.
          ref="refs/tags/raptor-one-time-apps-consumed"

          if gh api "repos/$REPOSITORY/git/ref/tags/raptor-one-time-apps-consumed" --jq .object.sha >/dev/null 2>&1; then
            existing_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/raptor-one-time-apps-consumed" --jq .object.sha)"
            if [[ "$existing_sha" == "$IMAGE_COMMIT" ]]; then
              echo "One-time integration tag already points to this image commit; finalization is complete."
              exit 0
            fi
            if [[ "$RECOVERY_RUN" == "true" ]]; then
              echo "Recovery image contains the repaired app payload; moving the internal consumed marker to $IMAGE_COMMIT."
              gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/raptor-one-time-apps-consumed" \
                -F sha="$IMAGE_COMMIT" \
                -F force=true >/dev/null
            else
              echo "::error::The one-time integration tag already exists but points to $existing_sha, not $IMAGE_COMMIT. Use the explicit maintainer recovery dispatch to repair the payload."
              exit 1
            fi
          fi

          if ! gh api --method POST "repos/$REPOSITORY/git/refs" \
            -f ref="$ref" \
            -f sha="$IMAGE_COMMIT"; then
            # A concurrent retry may have created the tag after our first
            # lookup. Accept that only when it points to this exact commit.
            existing_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/raptor-one-time-apps-consumed" --jq .object.sha 2>/dev/null || true)"
            if [[ "$existing_sha" != "$IMAGE_COMMIT" ]]; then
              echo "::error::Could not create the one-time integration tag; existing target is '${existing_sha:-missing}'."
              exit 1
            fi
          fi

          verified_sha="$(gh api "repos/$REPOSITORY/git/ref/tags/raptor-one-time-apps-consumed" --jq .object.sha)"
          if [[ "$verified_sha" != "$IMAGE_COMMIT" ]]; then
            echo "::error::Created one-time integration tag points to $verified_sha instead of $IMAGE_COMMIT."
            exit 1
          fi
          echo "One-time integration consumed and verified at $verified_sha."

  # Runs only when the build fails. GitHub's raw job logs are awkward to get at,
  # so this reads the failed job's log on the runner and posts the first real
  # error, with context, as an annotation. It shows on the run page and is
  # available through the API without downloading any logs.
  diagnose:
    name: Explain build failure
    needs: build
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Post the build error as an annotation
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          for id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
            ok=0
            for _ in 1 2 3 4 5 6; do
              if curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/jobs/$id/logs" -o job.log 2> err.txt && [ -s job.log ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" = 0 ]; then
              echo "::warning::could not fetch the log for job $id: $(head -c 300 err.txt | tr '\n' ' ')"
              continue
            fi
            # Strip timestamps, colours and BlueBuild's repeated "[hh:mm:ss name] =>" prefix, and
            # shorten lines: GitHub caps one annotation at 4096 characters.
            sed -E 's/^[0-9T:.Z-]+ //; s/\x1b\[[0-9;]*m//g; s/^ *\[[0-9:]+ [^]]*\] => //' job.log | cut -c1-170 > clean.log
            emit() {  # emit "title" file -> one annotation (newlines/percent encoded, last 3800 chars kept)
              local msg
              msg=$(tail -c 3800 "$2" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=$1 (job $id)::$msg"
            }
            # 1) every line that looks like a failure (last 25), so the cause is visible at a glance
            grep -n -i -E "Failed '|error:|ERROR\]|No match|not found|unable to|cannot |conflict|exit code|denied|no such file|syntax error" clean.log \
              | grep -v -E "log_error|alias |echo |notice|ubuntu-latest" | tail -n 25 | cut -c1-170 > fails.txt
            [ -s fails.txt ] && emit "Failure lines" fails.txt
            # 2) the context around the first module failure (or the last failure line)
            n=$(grep -n -m1 -E "Failed '[^']*' Module" clean.log | cut -d: -f1)
            [ -z "$n" ] && n=$(tail -n 1 fails.txt | cut -d: -f1)
            if [ -n "$n" ]; then
              start=$((n>28 ? n-28 : 1)); end=$((n+6))
              sed -n "${start},${end}p" clean.log > ctx.txt
              emit "Context before the failure" ctx.txt
            fi
          done
