name: Build Raptor OS

on:
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/workflows/build.yml"

  pull_request:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"

  schedule:
    - cron: "0 4 * * 0"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only supersede older runs for the same PR/branch push; never cancel a
  # scheduled or manually dispatched build because someone pushed meanwhile.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Check signing secret
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "$SIGNING_SECRET" ]; then
            echo "::error title=Missing secret::SIGNING_SECRET is not set (Settings > Secrets and variables > Actions). The image cannot be signed, so users' updates will be rejected."
            exit 1
          fi

      - name: Validate scripts
        run: |
          chmod +x .github/scripts/validate.sh
          .github/scripts/validate.sh

      - name: Build and push image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
