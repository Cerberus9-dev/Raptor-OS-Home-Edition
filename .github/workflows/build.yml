name: Build Raptor OS

on:
  push:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
      - "changelog.md"
  pull_request:
    branches:
      - main
    paths:
      - "recipes/**"
      - "files/**"
      - ".github/scripts/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  check-latest-push:
    name: Check whether this push is still current
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.latest.outputs.should_build }}
    steps:
      - name: Compare event SHA with current branch head
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" != "push" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! latest_sha="$(gh api "repos/$REPOSITORY/commits/$REF_NAME" --jq .sha)"; then
            echo "::warning::Could not verify the live branch head; allowing this build rather than dropping a push."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$latest_sha" == "$PUSH_SHA" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping superseded push $PUSH_SHA; current branch head is $latest_sha."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-latest-push
    if: ${{ needs.check-latest-push.outputs.should_build == 'true' }}
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Lint all GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: Validate scripts
        run: |
          chmod +x .github/scripts/validate.sh
          .github/scripts/validate.sh

      - name: Check signing secret
        if: github.event_name != 'pull_request'
        env:
          SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}
        run: |
          if [ -z "$SIGNING_SECRET" ]; then
            echo "::error title=Missing secret::SIGNING_SECRET is not set (Settings > Secrets and variables > Actions). The image cannot be signed, so users' updates will be rejected."
            exit 1
          fi

      - name: Free disk space
        run: |
          set -euo pipefail
          timeout 90s sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || {
            echo "::warning::Optional SDK cleanup timed out; continuing with the runner's remaining free space."
          }
          df -h

      - name: Cache Raptor Music workspace
        uses: actions/cache@v4
        with:
          path: files/scripts/raptor-music/target
          key: raptor-music-target-${{ runner.os }}-${{ hashFiles('files/scripts/raptor-music/Cargo.toml', 'files/scripts/raptor-music/crates/**/Cargo.toml') }}
          restore-keys: raptor-music-target-${{ runner.os }}-

      - name: Build Raptor Music
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          install_attempt=1
          until sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends \
            pkg-config libasound2-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl1-mesa-dev libegl1-mesa-dev \
            libgles2-mesa-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libudev-dev libdbus-1-dev; do
            if [[ "$install_attempt" -ge 3 ]]; then
              echo "::error::Unable to install Raptor Music build dependencies after 3 attempts."
              exit 1
            fi
            echo "::warning::APT dependency installation failed; retrying (attempt $((install_attempt + 1))/3)."
            sleep $((install_attempt * 20))
            install_attempt=$((install_attempt + 1))
          done

          cargo build --release --workspace --manifest-path files/scripts/raptor-music/Cargo.toml
          install -Dm755 files/scripts/raptor-music/target/release/raptor-desktop files/staging/raptor-music

      - name: Test Raptor Music workspace
        run: cargo test --workspace --manifest-path files/scripts/raptor-music/Cargo.toml

      - name: Set up Node.js for upstream Shroudly
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: files/scripts/shroudly-raptor/upstream/package-lock.json

      - name: Build original Shroudly desktop app
        working-directory: files/scripts/shroudly-raptor/upstream
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          set -euo pipefail
          npm ci
          npm run build:core
          npm run check:translations
          npm run build
          npm run test:net
          npx electron-builder --linux dir --x64 --publish never

          APP_DIR="$PWD/dist/linux-unpacked"
          APP_BIN="$(find "$APP_DIR" -maxdepth 1 -type f -executable -printf '%f\n' | grep -i -x 'shroudly' | head -n1 || true)"
          if [[ -z "$APP_BIN" ]]; then
            echo "::error::Could not find the original Shroudly Electron executable in dist/linux-unpacked."
            find "$APP_DIR" -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          STAGE="$GITHUB_WORKSPACE/files/staging"
          rm -rf "$STAGE/raptor-shroudly-app" "$STAGE/raptor-shroudly-app.tar.gz"
          install -d "$STAGE"
          tar -C "$APP_DIR" -czf "$STAGE/raptor-shroudly-app.tar.gz" .
          install -d "$STAGE/raptor-shroudly-app"
          cp -a "$APP_DIR/." "$STAGE/raptor-shroudly-app/"

          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            echo "exec /usr/lib/raptor-shroudly/${APP_BIN} \"\$@\""
          } > "$STAGE/raptor-shroudly"
          chmod 0755 "$STAGE/raptor-shroudly"

          install -Dm0644 public/icon.png "$STAGE/raptor-shroudly-icon.png"
          install -Dm0644 LICENSE "$STAGE/raptor-shroudly-license"

          {
            echo "Raptor Shroudly"
            echo "---------------"
            echo "This package is the Raptor OS edition of Shroudly."
            echo ""
            echo "Functional core (engine, UI, techniques):"
            echo " Shroudly - https://github.com/umutxyp/Shroudly"
            echo " Licensed under the MIT License (see LICENSE in this package)."
            echo ""
            echo "Raptor OS packaging, branding, desktop integration and future"
            echo "native routing / game-mode work:"
            echo " Cerberus9-dev / Raptor OS"
            echo " https://github.com/Cerberus9-dev/Raptor-OS-Home-Edition"
            echo ""
            echo "The original Shroudly project is preserved and credited. Raptor"
            echo "does not claim authorship of the upstream engine or techniques."
          } > "$STAGE/raptor-shroudly-notice"

          # Polkit policy for the Raptor Shroudly action. Upstream Shroudly
          # elevates its advanced engine through plain pkexec
          # (org.freedesktop.policykit.exec), so this file is staged because
          # the Raptor installer requires it; it does not change the prompt
          # upstream shows.
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE policyconfig PUBLIC "-//freedesktop//DTD PolicyKit Policy Configuration 1.0//EN" "http://www.freedesktop.org/standards/PolicyKit/1/policyconfig.dtd">'
            echo '<policyconfig>'
            echo '  <action id="me.codeshare.shroudly.pkexec">'
            echo '    <description>Run the Shroudly advanced engine</description>'
            echo '    <message>Authentication is required to run the Shroudly advanced engine</message>'
            echo '    <defaults>'
            echo '      <allow_any>auth_admin</allow_any>'
            echo '      <allow_inactive>auth_admin</allow_inactive>'
            echo '      <allow_active>auth_admin</allow_active>'
            echo '    </defaults>'
            echo '  </action>'
            echo '</policyconfig>'
          } > "$STAGE/raptor-shroudly-policy"

          test -x "$STAGE/raptor-shroudly"
          test -s "$STAGE/raptor-shroudly-app.tar.gz"
          test -s "$STAGE/raptor-shroudly-app/resources/app.asar"
          test -s "$STAGE/raptor-shroudly-icon.png"
          test -s "$STAGE/raptor-shroudly-license"
          test -s "$STAGE/raptor-shroudly-policy"
          test -s "$STAGE/raptor-shroudly-notice"
          echo "Staged Shroudly payload successfully"

      - name: Verify and include Raptor app payloads in the image context
        run: |
          set -euo pipefail
          test -x files/staging/raptor-music
          test -x files/staging/raptor-shroudly
          test -s files/staging/raptor-shroudly-app.tar.gz
          test -s files/staging/raptor-shroudly-app/resources/app.asar
          test -s files/staging/raptor-shroudly-icon.png
          test -s files/staging/raptor-shroudly-license
          test -s files/staging/raptor-shroudly-policy
          test -s files/staging/raptor-shroudly-notice

          git add -f -- files/staging
          git ls-files --error-unmatch \
            files/staging/raptor-music \
            files/staging/raptor-shroudly \
            files/staging/raptor-shroudly-app.tar.gz \
            files/staging/raptor-shroudly-app/resources/app.asar \
            files/staging/raptor-shroudly-icon.png \
            files/staging/raptor-shroudly-license \
            files/staging/raptor-shroudly-policy \
            files/staging/raptor-shroudly-notice >/dev/null
          echo "Verified both custom Raptor app binaries and added them to the BlueBuild context."

          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --no-verify -m "ci: include Raptor app payloads in image context"

      - name: Build and push image
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          skip_checkout: true

      - name: Verify both apps inside the published image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          IMAGE_VERSION="$(sed -nE 's/^image-version:[[:space:]]*([^[:space:]#]+).*/\1/p' recipes/recipe.yml | head -n1)"
          if [[ -z "$IMAGE_VERSION" ]]; then
            echo "::error::Could not read image-version from recipes/recipe.yml"
            exit 1
          fi

          IMAGE_VERSION_SUFFIX="${IMAGE_VERSION##*-}"
          if [[ ! "$IMAGE_VERSION_SUFFIX" =~ ^[0-9]+ ]]; then
            echo "::error::Unexpected BlueBuild image-version suffix: $IMAGE_VERSION"
            exit 1
          fi

          # BlueBuild publishes the short commit-SHA tag for push, and
          # pr-<number> for pull requests, each suffixed with the
          # image-version number (e.g. 44 from stable-44).
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            IMAGE_TAG="pr-$PR_NUMBER-$IMAGE_VERSION_SUFFIX"
          else
            IMAGE_TAG="${GITHUB_SHA:0:7}-$IMAGE_VERSION_SUFFIX"
          fi

          echo "Verifying BlueBuild image tag: $IMAGE_TAG"
          IMAGE_REF="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/raptor-os:$IMAGE_TAG"

          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          pull_attempt=1
          until docker pull "$IMAGE_REF"; do
            if [[ "$pull_attempt" -ge 4 ]]; then
              echo "::error::Unable to pull the published image for verification after 4 attempts."
              exit 1
            fi
            delay=$((pull_attempt * 15))
            echo "::warning::Image verification pull failed; retrying in ${delay}s (attempt $((pull_attempt + 1))/4)."
            sleep "$delay"
            pull_attempt=$((pull_attempt + 1))
          done

          docker run --rm --entrypoint /bin/bash "$IMAGE_REF" -lc '
            set -euo pipefail

            check_file() {
              local mode="$1" path="$2"
              if [[ "$mode" == "x" ]]; then
                [[ -x "$path" ]] || { echo "MISSING_EXECUTABLE: $path" >&2; exit 1; }
              else
                [[ -s "$path" ]] || { echo "MISSING_FILE: $path" >&2; exit 1; }
              fi
              echo "VERIFIED: $path"
            }

            check_file x /usr/bin/raptor-music
            check_file x /usr/bin/raptor-shroudly
            check_file s /usr/lib/raptor-shroudly/resources/app.asar
          '

          echo "Published image contains both custom Raptor app payloads."
