name: Build Raptor Home Edition ISO

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Build Release Type'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - stable

jobs:
  build-home-iso:
    name: Build Raptor Home ISO
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h

      # ── Build OSTree image via blue-build ────────────────────────────────────
      - name: Build OSTree image
        id: build
        uses: blue-build/github-action@v1
        with:
          recipe: recipe.yml
          registry_token: ${{ secrets.GITHUB_TOKEN }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}

      # ── Create ISO from OSTree image ────────────────────────────────────────
      - name: Install ISO tooling
        run: |
          sudo dnf install -y coreos-installer xorriso

      - name: Download base Fedora ISO
        run: |
          # Download latest Fedora Workstation ISO for customization
          FEDORA_ISO_URL="https://download.fedoraproject.org/pub/fedora/linux/releases/40/Workstation/x86_64/iso/Fedora-Workstation-Live-x86_64-40-1.14.iso"
          curl -L -o fedora-base.iso "$FEDORA_ISO_URL"
          sha256sum fedora-base.iso

      - name: Generate ISO from OSTree image
        id: iso
        run: |
          IMAGE_REF="${{ steps.build.outputs.image-ref }}"
          echo "Built image reference: $IMAGE_REF"
          
          # Create Ignition config that points to our OSTree image
          cat > /tmp/installer.ign << 'IGNITION'
{
  "ignition": { "version": "3.2.0" },
  "storage": {
    "files": [
      {
        "path": "/etc/hostname",
        "overwrite": true,
        "contents": { "source": "data:,raptor-os" }
      }
    ]
  },
  "systemd": {
    "units": [
      {
        "name": "raptor-firstboot.service",
        "enabled": true,
        "contents": "[Unit]\nDescription=Raptor OS First Boot\nAfter=network-online.target\nWants=network-online.target\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/raptor-firstboot.sh\nRemainAfterExit=yes\n\n[Install]\nWantedBy=multi-user.target"
      }
    ]
  }
}
IGNITION

          # Use coreos-installer to embed the ignition config and OSTree reference
          # into the base Fedora ISO
          coreos-installer iso customize \
            --ignition /tmp/installer.ign \
            --output raptor-home-${{ github.run_id }}-amd64.iso \
            fedora-base.iso \
            2>&1 | tee iso-build.log

          # The resulting ISO will boot into the Fedora installer with our ignition
          # which will then pull the OSTree image from the registry

      - name: Verify ISO
        run: |
          ls -la *.iso
          sha256sum *.iso > raptor-home.iso.sha256
          cat raptor-home.iso.sha256

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raptor-home-iso-${{ github.run_id }}
          path: |
            *.iso
            *.iso.sha256
          retention-days: 14

      - name: Upload Failure Logs on Error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raptor-home-build-failure-log
          path: |
            iso-build.log
            build.log
          retention-days: 7
