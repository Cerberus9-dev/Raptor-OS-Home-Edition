[package]
name = "raptor-desktop"
version = "0.2.17"
edition = "2021"

[build-dependencies]
slint-build = "1.5"

[dependencies]
raptor-core = { path = "../raptor-core" }
raptor-library = { path = "../raptor-library" }
raptor-audio = { path = "../raptor-audio" }
slint = "1.5"
tokio = { version = "1.35", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "v5"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde_json = "1.0"
rfd = "0.14"
symphonia = "0.5"
