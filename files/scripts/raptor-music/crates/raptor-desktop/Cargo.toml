[package]
name = "raptor-desktop"
version = "0.2.17"
edition = "2021"

[build-dependencies]
slint-build = "1.5"

[dependencies]
raptor-core = { path = "../raptor-core" }
raptor-library = { path = "../raptor-library" }
raptor-audio = { path = "../raptor-audio" }
slint = { version = "1.5", features = ["image-decoders"] }
tokio = { version = "1.35", features = ["full"] }
uuid = { version = "1.6", features = ["v4", "v5"] }
base64 = "0.22"
sha2 = "0.10"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
rfd = "0.14"
symphonia = "0.5"
