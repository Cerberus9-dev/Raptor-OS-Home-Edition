# Raptor OS — Wine / Proton session defaults.
# Applied to every login through /etc/environment.d so raw `wine` and launchers
# that inherit the session env (Lutris, winetricks, …) all pick these up.
#
# Kernel-level synchronization: fsync (available on Raptor's fsync-enabled
# kernel) with esync as fallback. Setting both lets wineserver choose what the
# running kernel supports instead of falling back to CPU-heavy syscall sync —
# a common cause of "weird" Wine behaviour and stutter in Windows games.
WINEESYNC=1
WINEFSYNC=1
# Stop Wine from generating a Windows desktop entry per prefix/app. Avoids slow
# first launches and a pile of stale "Uninstall…" entries accumulating in the
# application menu on every prefix you create.
WINEDLLOVERRIDES=winemenubuilder.exe=d
# Silence Wine's debug channel chatter by default. Override per-run with
# WINEDEBUG=+... (e.g. WINEDEBUG=-all,+err for error-only traces).
WINEDEBUG=-all