[main]
# Hand the per-link DNS servers from DHCP into systemd-resolved (stub
# 127.0.0.53). The link's own resolver (e.g. a school/corporate DNS) is tried
# first; the public Cloudflare/Quad9 DoT resolvers in raptor-dns.conf are
# used only when that link provides none. Pinning Cloudflare as the SOLE
# resolver breaks networks that DPI-block 1.1.1.1 — uncached lookups hang.
dns=systemd-resolved
