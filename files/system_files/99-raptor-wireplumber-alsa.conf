# Raptor OS: WirePlumber ALSA device tuning
# Idle devices suspend after 60 s (stock is 5 s). This used to be "never suspend"
# (timeout 0 + api.alsa.disable-suspend) to avoid a pop on wake, which kept the
# sound card, its codec and the PipeWire graph powered around the clock and cost
# battery on every laptop. 60 s keeps most pop protection (short pauses never
# suspend) without the constant drain.
# Headroom set to 0 for outputs (was 8192 — 170ms of extra buffer that caused
# timing conflicts with the quantum and produced static under gaming load).
monitor.alsa.rules = [
  {
    matches = [{ node.name = "~alsa_output.*" }]
    actions = {
      update-props = {
        api.alsa.period-size            = 512
        api.alsa.headroom               = 0
        api.alsa.period-num             = 2
        session.suspend-timeout-seconds = 60
        resample.quality                = 6
      }
    }
  }
  {
    matches = [{ node.name = "~alsa_input.*" }]
    actions = {
      update-props = {
        api.alsa.period-size            = 256
        api.alsa.headroom               = 512
        session.suspend-timeout-seconds = 60
        resample.quality                = 6
      }
    }
  }
  # USB audio devices — general rule, not brand-specific.
  # Covers wired USB headsets/DACs and wireless headsets using USB RF dongles.
  # USB audio gets a more conservative buffer than integrated HDA audio to
  # tolerate controller and bus scheduling jitter. 512 frames × 3 periods at
  # 48 kHz is approximately 32 ms of queued audio (versus 10.7 ms for the
  # native 512-frame PipeWire quantum), not 21 ms. This halves the previous
  # 64 ms queue while retaining headroom for stable playback under gaming load.
  # Placed after the generic wildcards so it takes precedence for any
  # matching device.
  {
    matches = [
      { node.name = "~alsa_output.usb-.*" }
      { node.name = "~alsa_input.usb-.*" }
    ]
    actions = {
      update-props = {
        api.alsa.period-size            = 512
        api.alsa.headroom               = 256
        api.alsa.period-num             = 3
        session.suspend-timeout-seconds = 60
        # Preserve the high-quality USB resampling path; audio fidelity is
        # not traded away for a small CPU saving.
        resample.quality                = 10
      }
    }
  }
]

# ── Bluetooth audio devices ────────────────────────────────────────────────────
# Separate from everything above — genuine Bluetooth audio (earbuds,
# headphones pairing directly over A2DP, not a USB RF dongle) doesn't go
# through ALSA at all; it's handled by PipeWire's own bluez5 module with a
# separate rules block. Never configured until now.
monitor.bluez.rules = [
  {
    matches = [{ device.name = "~bluez_card.*" }]
    actions = {
      update-props = {
        # Prefer high-quality A2DP over the low-quality HSP/HFP mic profile
        # unless a mic is actually needed (e.g. a call comes in) — avoids
        # silently dropping to phone-call-quality audio for no reason.
        bluez5.autoswitch-profile = true
        # Higher-quality SBC mode where the headset supports it — SBC is the
        # only codec guaranteed supported by every Bluetooth audio device.
        bluez5.enable-sbc-xq      = true
        # mSBC for the mic side of HSP/HFP calls, when available — noticeably
        # better mic quality than the older, narrowband-only default.
        bluez5.enable-msbc        = true
      }
    }
  }
]
