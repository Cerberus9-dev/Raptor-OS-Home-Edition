# Raptor OS: ZRAM swap — single source of truth for swap configuration.
# raptor-zram-init.service has been removed to avoid race conditions with
# this generator (you cannot resize an active ZRAM device).
# systemd-zram-generator runs before swap is activated, so this is correct.

[zram0]
# Logical swap capacity: up to physical RAM, capped at 8 GiB.
# The limit is virtual capacity, not RAM preallocated at boot; physical pages
# are consumed only as data is written into the compressed block device.
# On 4 GiB systems → 4 GiB logical ZRAM; on 8 GiB+ systems → 8 GiB cap.
zram-size = min(ram, 8192)

# Prefer LZ4 on older and low-power CPUs (including 4 GB / older Core i3
# systems). It compresses and decompresses much faster than zstd, reducing CPU
# contention when Steam, Electron chat clients and games compete for memory.
# Trade-off: LZ4 generally compresses less tightly, so the same logical zram
# capacity may use more physical RAM. The kernel still reclaims normally.
compression-algorithm = lz4

# ZRAM gets swap priority 100 — always preferred over disk-based swap.
# If a hibernation partition is present it gets priority ≤ 1 by default.
swap-priority = 100

# discard: tell the kernel it can discard ZRAM pages that have been
# moved back to RAM, freeing the compressed slot for reuse. Reduces
# ZRAM memory overhead over long sessions as apps free memory.
options = discard
