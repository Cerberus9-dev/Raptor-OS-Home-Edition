# Raptor OS — raise the system-wide process file-descriptor ceiling.
# Wine esync opens one eventfd per synchronization object, and games with heavy
# I/O can exceed the stock limits when large prefixes/mods are loaded, producing
# "eventfd: Too many open files" crashes. Matches Valve's recommendation in the
# esync README (DefaultLimitNOFILE in both system.conf and user.conf paths).
[Manager]
DefaultLimitNOFILE=1048576:1048576