# Raptor OS: libinput quirks — prevent stuck cursor after suspend/resume
# This file uses libinput's quirks format to override device-specific behavior.
# Matching is by vendor/product ID; the catch-all MatchUdevType=touchpad
# applies to all touchpad devices on the system.

[Touchpad disable-while-typing]
MatchUdevType=touchpad
AttrEventCodeDisable=ABS_MT_SLOT;ABS_MT_TRACKING_ID

[Touchpad tap-to-click]
MatchUdevType=touchpad
AttrTappingEnabled=true

[Touchpad middle-emulation]
MatchUdevType=touchpad
AttrMiddleEmulationEnabled=true
