# Raptor OS: NetworkManager Wi-Fi reliability
#
# Keys in the [connection] section of NetworkManager.conf must use the full
# property name (setting.property). The previous version of this file used
# bare "autoconnect-retries" and a "wifi.powersave" under [device]; neither is
# valid there, so none of it was ever applied.

[main]
# Retry autoconnect forever instead of giving up after 4 failed attempts
# (0 = retry forever). A profile that used up its retries stays disconnected
# until something resets it -- the classic "Wi-Fi never reconnects".
autoconnect-retries-default=0

[connection]
# 2 = disable 802.11 power save (3 = enable). Power save causes missed beacons,
# slow wake-ups and drops on many AP/driver combinations.
wifi.powersave=2

[device]
# Do not use a random MAC for scans: some school/corporate APs ignore or
# deauthenticate clients that scan with a changing address.
wifi.scan-rand-mac-address=no
