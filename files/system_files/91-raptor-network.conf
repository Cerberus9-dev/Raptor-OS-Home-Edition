# Raptor OS: NetworkManager WiFi reconnection hardening
# Forces aggressive reconnection after suspend/resume and general disconnects.
# School/corporate networks often drop clients during suspend; without this,
# NetworkManager may wait minutes before attempting to reconnect.

[connection]
# Reconnection: try immediately, then every 5 s for up to 5 attempts
autoconnect-retries=5

[device]
# Keep WiFi alive through suspend cycles
wifi.powersave=2

[device-wifi]
# Fast scan interval when searching for known networks after resume
wifi.scan-rand-mac-address=no
