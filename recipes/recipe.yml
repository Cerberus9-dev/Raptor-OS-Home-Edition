# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: raptor-os
description: Raptor OS — a Bazzite-based custom image for gaming, development, and creative workflows.
base-image: ghcr.io/ublue-os/bazzite
# Pinned to Fedora 44. Bazzite moved its moving `stable` tag from Fedora 44 to Fedora 45 on
# 2026-11-04, and on a Fedora 45 base `rpm-ostree` commands fail inside the image build
# ("This system was not booted via libostree"), which broke every build. `stable-44` is the
# last Fedora 44 build Bazzite published (2026-10-26). Moving to 45 is a separate, deliberate
# change: the package modules need porting first.
image-version: stable-44

modules:
  # ── Static files ─────────────────────────────────────────────────────────
  - type: files
    files:
      # User service — must live in the user unit dir so it runs inside the
      # login session (needed for GUI dialogs and correct env on Wayland).
      - source: ../files/system_files/raptor-firstboot.service
        destination: /usr/lib/systemd/user/raptor-firstboot.service
      - source: ../files/system_files/raptor-app-choice.sh
        destination: /usr/bin/raptor-app-choice.sh
      - source: ../files/system_files/raptor-browser-choice.sh
        destination: /usr/bin/raptor-browser-choice.sh
      - source: ../files/system_files/raptor-chat-choice.sh
        destination: /usr/bin/raptor-chat-choice.sh
      # Default file manager (Dolphin) + image/archive type associations.
      - source: ../files/system_files/raptor-mimeapps.list
        destination: /etc/xdg/mimeapps.list
      - source: ../files/system_files/raptor-mimeapps.list
        destination: /etc/skel/.config/mimeapps.list
      # Flight-deck Plasma panel theme: restrained radar markings, readable
      # task buttons, and a dark instrument-panel surface.
      - source: ../files/system_files/raptor-flightdeck-theme
        destination: /usr/share/plasma/desktoptheme/raptor-flightdeck
      - source: ../files/system_files/raptor-flightdeck-plasmarc
        destination: /etc/xdg/plasmarc
      # ── Audio: PipeWire low-latency gaming config ──────────────────────────
      - source: ../files/system_files/99-raptor-pipewire-lowlatency.conf
        destination: /etc/pipewire/pipewire.conf.d/99-raptor-lowlatency.conf
      - source: ../files/system_files/99-raptor-pipewire-pulse-lowlatency.conf
        destination: /etc/pipewire/pipewire-pulse.conf.d/99-raptor-pulse-lowlatency.conf
      - source: ../files/system_files/99-raptor-wireplumber-alsa.conf
        destination: /etc/wireplumber/wireplumber.conf.d/99-raptor-alsa.conf
      - source: ../files/system_files/raptor-audio-rt.conf
        destination: /etc/security/limits.d/raptor-audio-rt.conf
      - source: ../files/system_files/raptor-pipewire-restart.conf
        destination: /etc/systemd/user/pipewire.service.d/raptor-restart.conf
      - source: ../files/system_files/raptor-pipewire-restart.conf
        destination: /etc/systemd/user/pipewire-pulse.service.d/raptor-restart.conf
      - source: ../files/system_files/raptor-wireplumber-restart.conf
        destination: /etc/systemd/user/wireplumber.service.d/raptor-restart.conf
      - source: ../files/system_files/zram-generator.conf
        destination: /etc/systemd/zram-generator.conf
      # ── DNS: let systemd-resolved handle everything (ignores DHCP DNS) ─────
      - source: ../files/system_files/91-raptor-dns.conf
        destination: /etc/NetworkManager/conf.d/91-raptor-dns.conf
      # ── WiFi reconnection hardening ────────────────────────────────────────
      - source: ../files/system_files/91-raptor-network.conf
        destination: /etc/NetworkManager/conf.d/91-raptor-network.conf
      # ── WiFi reconnection hardening ────────────────────────────────────────
      - source: ../files/system_files/raptor-suspend-resume-wifi.sh
        destination: /etc/NetworkManager/dispatcher.d/99-raptor-wifi-resume
      # ── Input device / cursor fixes ────────────────────────────────────────
      # ── File manager (Dolphin) stability ───────────────────────────────────
      - source: ../files/system_files/dolphinrc
        destination: /etc/xdg/dolphinrc
      - source: ../files/system_files/dolphinrc
        destination: /etc/skel/.config/dolphinrc
      # ── Baloo (file indexer) stability: disable content indexing ────────────
      - source: ../files/system_files/baloofilerc
        destination: /etc/xdg/baloofilerc
      - source: ../files/system_files/baloofilerc
        destination: /etc/skel/.config/baloofilerc
      # ── Wine / Proton usability + fd limits ────────────────────────────────
      - source: ../files/system_files/10-raptor-wine.conf
        destination: /etc/environment.d/10-raptor-wine.conf
      - source: ../files/system_files/raptor-nofile.conf
        destination: /etc/systemd/system.conf.d/10-raptor-nofile.conf
      - source: ../files/system_files/raptor-nofile.conf
        destination: /etc/systemd/user.conf.d/10-raptor-nofile.conf
      # ── CI-built Raptor application payloads ─────────────────────────
      # CI builds and stages Raptor Music and custom Raptor Shroudly for every image.
      # Local builds without those generated payloads safely skip their installers.
      - source: ../files/staging
        destination: /tmp/raptor-staging

  # ── RPM packages ─────────────────────────────────────────────────────────
  # Must run BEFORE the rpm-ostree module below. The base image ships tuned-ppd,
  # which conflicts with power-profiles-daemon (both provide ppd-service), so it
  # has to be removed before the install resolves. Tolerant of packages that the
  # base image no longer ships.
  - type: script
    scripts:
      - raptor-remove-packages/install.sh

  - type: rpm-ostree
    install:
      # System utilities
      - fastfetch
      - htop
      - ark
      - 7zip
      - unzip
      - curl
      - wget
      - jq
      - zenity
      - gwenview
      - kcalc
      - liberation-fonts
      - power-profiles-daemon

      # Desktop runtime libraries used by the Raptor application suite.
      - gtk3
      - libnotify
      - nss
      - libXtst
      - at-spi2-core
      - libsecret
      - xdg-utils
      - libdrm
      - mesa-libgbm
      - alsa-lib

      # Media
      - mpv

      # Gaming
      - irqbalance
      - gamemode
      # Note: mangohud/goverlay are intentionally omitted from the RPM list.
      # Bazzite's stable base now ships its own packaging of MangoHud
      # (terra-mangohud), and installing Fedora's mangohud here conflicts with
      # it on /usr/bin/mangoapp. The overlay therefore comes from the base
      # image, and the GOverlay config GUI is installed as a Flatpak instead.
      - wine
      # Wine runtime pieces — without these, Windows apps/.NET and JS-based
      # program loaders hang on first launch (Wine stalls trying to download
      # them) or fail outright. See /usr/share/wine/gecko and /usr/share/wine/mono
      - wine-mono
      - mingw32-wine-gecko
      - mingw64-wine-gecko
      - winetricks
      - protontricks
      # UMU runs Proton outside the Steam client.
      - umu-launcher

      # Python + GObject — required by Raptor GTK4/Adwaita apps
      - python3
      - python3-gobject
      - gtk4
      - libadwaita

      # Theming
      - kde-partitionmanager
      - kvantum
      - kvantum-qt5
      - jetbrains-mono-fonts
      - qt5-qtbase

  # ── Flatpaks ─────────────────────────────────────────────────────────────
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        # Core system tools only — everything else moved to firstboot app picker
        install:
          - net.davidotek.pupgui2
        # No browser ships in the image on purpose — the default image stays as
        # minimal as possible. All popular browsers (Firefox, Brave, Chromium,
        # Chrome, Edge) are offered as downloads in the firstboot browser-choice
        # dialog instead, keeping sizing/policy fully in the user's hands.

  # ── Kernel boot arguments ─────────────────────────────────────────────────────
  - type: kargs
    kargs:
      - transparent_hugepage=madvise

  # ── Custom build scripts ──────────────────────────────────────────────────────
  - type: script
    scripts:
      - raptor-hud/install.sh
      - raptor-cortex/install.sh
      - raptor-gpu-profile/install.sh
      - raptor-gaming/install.sh
      - raptor-update/install.sh
      - raptor-wallpaper-manager/install.sh
      - raptor-wine/install.sh
      - raptor-dolphin-stability/install.sh
      - raptor-cheatsheet/install.sh
      - raptor-tasks/install.sh
      - raptor-gaming-devices/install.sh
      - raptor-hardware-fixes/install.sh
      - raptor-music/install.sh
      - shroudly-raptor/install.sh

  # ── Systemd units ───────────────────────────────────────────────────────────
  - type: systemd
    system:
      enabled:
        # KDE Powerdevil's battery slider talks to this D-Bus service. Make
        # the provider explicitly enabled instead of relying on a transient
        # Wants= relationship from the initial-profile unit.
        - power-profiles-daemon.service
        - raptor-gpu-profile.service
        - raptor-bt-name.service
    user:
      enabled:
        - raptor-firstboot.service
        - raptor-wine-associations.service
        - gamemoded.service

  # Configure signature verification for the signed OCI image and installer.
  - type: signing
